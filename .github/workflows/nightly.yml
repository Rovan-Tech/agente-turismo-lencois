name: Nightly

# Testes pesados ou lentos demais para cada PR, mais o reescaneamento do que já está na main:
# vulnerabilidade nova aparece sem o código mudar. Falha aqui avisa o dono do repositório por
# e-mail. Roda também sob demanda (Actions > Nightly > Run workflow).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  TRIVY_IMAGE: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
  K6_IMAGE: grafana/k6@sha256:e66db15b860113878fa74670e31f5e274830b7b6e42c8bff28b2f2d86a257603

jobs:
  # Dependência e imagem com CVE publicada depois do último merge.
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: backend/.python-version
      - name: pip-audit
        run: |
          pip install -r backend/requirements-dev.txt
          cd backend && python -m pip_audit -r requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Trivy na imagem do backend
        run: |
          docker build --pull -t agente-backend:nightly backend
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress agente-backend:nightly

  # OWASP ZAP (DAST): ataca a API no ar a partir do contrato OpenAPI. Falha em alerta FAIL; os
  # avisos (cabeçalhos de segurança ausentes) ficam no relatório e em docs/tech-debt.md.
  dast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: scripts/ci/start_api.sh
      - name: ZAP API scan
        run: |
          mkdir zap-out && chmod 777 zap-out
          code=0
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-api-scan.py -t "$API_URL/openapi.json" -f openapi -r zap.html -J zap.json \
            -z "-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=Bearer\ ci-dashboard-token" \
            || code=$?
          echo "ZAP terminou com código $code (0 limpo, 2 só avisos, 1 falha)"
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-report
          path: zap-out
          retention-days: 30
          if-no-files-found: ignore

  # Carga leve (k6): 30 req/s por 30 s; reprova com erro > 1% ou p95 > 500 ms.
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: scripts/ci/start_api.sh
      - run: |
          docker run --rm --network host -v "$PWD/backend/tests/load:/scripts:ro" \
            -e BASE_URL="$API_URL" -e TOKEN=ci-dashboard-token "$K6_IMAGE" run --quiet /scripts/api.js

  # Fuzz com todos os checks do schemathesis. Hoje acusa lacunas de documentação do contrato
  # (status e `Allow` não declarados) e de campo extra aceito; estão em docs/tech-debt.md e o
  # job não reprova até serem corrigidas. O fuzz de robustez (5xx, schema) é obrigatório no PR.
  fuzz-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scripts/ci/requirements-tools.txt
      - run: pip install -r backend/requirements.txt -r scripts/ci/requirements-tools.txt
      - run: scripts/ci/start_api.sh
      # O resultado vai para o resumo da execução (o job fica verde por `continue-on-error`).
      - shell: bash
        run: |
          code=0
          FUZZ_CHECKS=all FUZZ_EXAMPLES=200 scripts/ci/fuzz_api.sh "$API_URL" >fuzz.log 2>&1 || code=$?
          { echo '### Fuzz completo do contrato'; echo '```'; tail -40 fuzz.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
        continue-on-error: true

  # Teste de mutação (mutmut) na lógica de decisão do bot e na verificação HMAC do webhook: mede
  # se os testes percebem uma mudança no código, e não só se executam a linha.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt
            scripts/ci/requirements-mutation.txt
      - run: pip install -r backend/requirements-dev.txt -r scripts/ci/requirements-mutation.txt
      - run: mutmut run
        working-directory: backend
      - run: python scripts/ci/mutation_score.py --dir backend/mutants --min 85
