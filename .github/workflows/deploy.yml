name: Deploy

# Só dispara depois que o CI (testes/segurança) passar num push na main — nunca
# publica um merge que não passou nos checks.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Escape hatch pra re-rodar o deploy sem precisar de um commit novo (ex:
  # trocou só um secret). Usa o HEAD atual da main nesse caso.
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      attestations: write
    outputs:
      backend_url: ${{ steps.deploy.outputs.url }}
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Autentica o Docker no Artifact Registry
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build da imagem
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/agente-turismo-lencois-backend
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" backend

      - name: Push da imagem
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/agente-turismo-lencois-backend
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - id: digest
        name: Digest da imagem publicada
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/agente-turismo-lencois-backend
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$SHA")
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"

      # Proveniência SLSA: prova de qual commit e qual workflow geraram a imagem. O nome do sujeito
      # não leva o caminho do registry: o atestado é público e esse caminho tem o ID do projeto GCP.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: agente-turismo-lencois-backend
          subject-digest: ${{ steps.digest.outputs.digest }}

      # Roda a migração ANTES de publicar a nova revisão — evita a app nova
      # bater num schema desatualizado no momento da troca de tráfego.
      - name: Migração do banco (alembic upgrade head)
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/agente-turismo-lencois-backend
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm -e DATABASE_URL="$DATABASE_URL" --entrypoint python \
            "$IMAGE:$SHA" -m alembic upgrade head

      # Idempotente (usa merge/upsert por id) — mantém o catálogo de passeios
      # atualizado a cada deploy sem duplicar registros.
      - name: Popula o catálogo de passeios
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/agente-turismo-lencois-backend
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm -e DATABASE_URL="$DATABASE_URL" --entrypoint python \
            "$IMAGE:$SHA" -m app.seed

      # Revisão que atende o tráfego hoje: é para onde o rollback automático volta se a nova falhar.
      - id: previous
        name: Guarda a revisão atual (alvo do rollback)
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          revision=$(scripts/ci/previous_revision.sh agente-turismo-lencois-backend "$REGION")
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@251330ba9a8a34bfbc1622895f42e1d53fd14522 # v2
        with:
          service: agente-turismo-lencois-backend
          region: ${{ secrets.GCP_REGION }}
          image: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_ARTIFACT_REPO }}/agente-turismo-lencois-backend:${{ github.event.workflow_run.head_sha || github.sha }}
          flags: --allow-unauthenticated --memory=2Gi --min-instances=0 --max-instances=3
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            WHATSAPP_TOKEN=${{ secrets.WHATSAPP_TOKEN }}
            WHATSAPP_PHONE_NUMBER_ID=${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
            WHATSAPP_VERIFY_TOKEN=${{ secrets.WHATSAPP_VERIFY_TOKEN }}
            WHATSAPP_APP_SECRET=${{ secrets.WHATSAPP_APP_SECRET }}
            DASHBOARD_API_TOKEN=${{ secrets.DASHBOARD_API_TOKEN }}
            INGEST_API_TOKEN=${{ secrets.INGEST_API_TOKEN }}
            PANEL_AUTH_MODE=${{ vars.PANEL_AUTH_MODE || 'token' }}
            ACCESS_TEAM_DOMAIN=${{ vars.ACCESS_TEAM_DOMAIN }}
            ACCESS_AUD=${{ vars.ACCESS_AUD }}
            FRONTEND_ORIGIN=https://agente-turismo-lencois.pages.dev

      # Depois de um rollback o Cloud Run mantém o tráfego fixo na revisão antiga e deploys novos
      # deixariam de recebê-lo sozinhos: `--to-latest` devolve o tráfego à revisão recém-publicada.
      - name: Direciona o tráfego para a revisão nova
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: |
          gcloud run services update-traffic agente-turismo-lencois-backend \
            --region "$REGION" --to-latest

      # Se a revisão nova não responder saudável, o tráfego volta sozinho para a anterior e o job
      # falha (o frontend, que depende dele, não é publicado).
      - name: Teste de fumaça e rollback automático
        env:
          URL: ${{ steps.deploy.outputs.url }}
          REGION: ${{ secrets.GCP_REGION }}
          PREVIOUS: ${{ steps.previous.outputs.revision }}
          # No modo `access` o token fixo deixa de valer: o teste confere só o que é público e que a
          # API fecha sem credencial.
          TOKEN: ${{ vars.PANEL_AUTH_MODE != 'access' && secrets.DASHBOARD_API_TOKEN || '' }}
        run: |
          scripts/ci/verify_deploy.sh "$URL" agente-turismo-lencois-backend "$REGION" "$PREVIOUS" "$TOKEN"

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deploy-backend.outputs.sha }}
          persist-credentials: false

      # Sem cache: este job publica em produção e um cache envenenado chegaria lá. A v7 faz cache
      # sozinha se o input não for desligado (a v4, usada nos outros workflows, não faz).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false

      - name: Instala dependências
        working-directory: frontend
        run: npm ci

      # `token` (hoje): o painel fala direto com o Cloud Run, com o token fixo no bundle. Nos outros
      # modos (ADR-0006) o painel chama `/api/*` na própria origem, pelo proxy do Pages atrás do
      # Cloudflare Access, e o bundle não leva token nenhum.
      - name: Build
        working-directory: frontend
        env:
          PANEL_AUTH_MODE: ${{ vars.PANEL_AUTH_MODE || 'token' }}
          BACKEND_URL: ${{ needs.deploy-backend.outputs.backend_url }}
          DASHBOARD_API_TOKEN: ${{ secrets.DASHBOARD_API_TOKEN }}
        run: |
          if [ "$PANEL_AUTH_MODE" = "token" ]; then
            export VITE_API_BASE_URL="$BACKEND_URL" VITE_API_TOKEN="$DASHBOARD_API_TOKEN"
          else
            export VITE_API_BASE_URL=""
          fi
          npm run build

      - name: Deploy no Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=agente-turismo-lencois --branch=main
          workingDirectory: frontend

  # Demonstração pública do painel (ADR-0007): dados fictícios, 100% em memória, sem backend. Não
  # depende do backend e NÃO recebe DATABASE_URL, token de API nem qualquer segredo do produto:
  # só as credenciais de publicação do Cloudflare.
  deploy-demo:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Só roda depois do CI verde num push na main, e nenhum segredo chega aos passos que executam
      # código do repositório (só o wrangler recebe as credenciais de publicação).
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false

      - name: Instala dependências
        working-directory: frontend
        run: npm ci

      # `DEMO_CONTACT_URL` (variável do repositório, opcional: site, formulário ou `mailto:` da Rovantech)
      # liga o botão "Falar com a Rovantech" na faixa da demonstração (ADR-0007).
      - name: Build da demonstração
        working-directory: frontend
        env:
          VITE_DEMO_CONTACT_URL: ${{ vars.DEMO_CONTACT_URL }}
        run: npm run build:demo

      # O pacote publicado é só `dist-demo`. A pasta `functions` (proxy da API) e o `wrangler.toml` do
      # painel real ficam de fora para a demonstração não carregar nada do produto.
      - name: Isola o pacote da demonstração
        run: rm -rf frontend/functions frontend/wrangler.toml

      # O projeto é criado na primeira vez; nas seguintes o comando falha por já existir (esperado).
      - name: Garante o projeto do Pages
        continue-on-error: true
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create agente-turismo-lencois-demo --production-branch=main
          workingDirectory: frontend

      - name: Deploy da demonstração no Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-demo --project-name=agente-turismo-lencois-demo --branch=main
          workingDirectory: frontend
