# Análise do SonarQube da Rovantech (https://sonar.rovantech.com). O endereço e o token vêm dos
# secrets da organização (SONAR_HOST_URL e SONAR_TOKEN); o workflow é .github/workflows/sonarqube.yml.
sonar.projectKey=Rovan-Tech_agente-turismo-lencois_58a81217-7516-41c7-b1ca-7945dd5302a1
sonar.projectName=agente-turismo-lencois
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,frontend/src,frontend/functions,scripts
sonar.tests=backend/tests,frontend/tests
sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/coverage/**,**/__pycache__/**,backend/alembic/versions/**,.claude/**

# A cobertura do projeto é a do app (backend/app e frontend/src), como no gate do repositório. Os
# scripts de CI e a função do Pages seguem analisados (bugs, duplicação), só ficam fora da cobertura.
sonar.coverage.exclusions=scripts/**,frontend/functions/**

sonar.python.version=3.11
# Gerados pelos testes (pytest-cov e vitest) no próprio workflow.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
